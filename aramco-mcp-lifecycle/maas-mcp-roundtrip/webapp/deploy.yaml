# Deploy manifest for the hosted MaaS<->MCP demo. The maas-mcp-creds Secret
# (LITELLM_KEY, MCP_CLIENT_SECRET) is created from cluster values by
# build-and-deploy.sh — never committed. Image comes from the in-cluster build.
apiVersion: apps/v1
kind: Deployment
metadata: { name: maas-mcp-demo, labels: { app: maas-mcp-demo } }
spec:
  replicas: 1
  selector: { matchLabels: { app: maas-mcp-demo } }
  template:
    metadata: { labels: { app: maas-mcp-demo } }
    spec:
      containers:
      - name: web
        image: image-registry.openshift-image-registry.svc:5000/maas-mcp-demo/maas-mcp-demo:latest
        ports: [ { containerPort: 8080 } ]
        envFrom: [ { secretRef: { name: maas-mcp-creds } } ]
        readinessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 5, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: maas-mcp-demo }
spec:
  selector: { app: maas-mcp-demo }
  ports: [ { port: 8080, targetPort: 8080 } ]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: { name: maas-mcp-demo }
spec:
  to: { kind: Service, name: maas-mcp-demo, weight: 100 }
  port: { targetPort: 8080 }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
