# =============================================================================
# LIVE OIDC edge for the MCP gateway — Envoy jwt_authn (verified live)
# =============================================================================
# WHY: The RHCL MCP Gateway (Tech Preview) cannot enforce a Kuadrant AuthPolicy —
# the wasm-shim's gRPC Check to Authorino fails for any newly-created gateway on
# the cluster (500). Root-caused and staged as a Red Hat TP defect. Until a fixed
# build ships, this self-contained Envoy edge provides clean OIDC enforcement:
#   no/invalid token -> 401   |   valid RHBK JWT -> 200 -> MCP federation
# It validates JWTs against the dedicated mcp-keycloak realm's JWKS (in-cluster),
# then forwards authenticated requests to the MCP gateway (Host rewritten).
#
# VERIFIED LIVE 2026-09-13 (api.ocp-gb): 401 no-token, 401 bad-token, 200 valid,
# response = real "Kuadrant MCP Gateway" federation.
#
# PRODUCTION/GA PATH: replace this edge with a native Kuadrant AuthPolicy on the
# MCP gateway once the wasm-shim defect is fixed — identical issuer/realm, no
# client changes. This edge pattern (JWT validation at the ingress) is itself a
# mainstream production approach.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-edge-config
  namespace: mcp-gateway-system
data:
  envoy.yaml: |
    admin:
      address: { socket_address: { address: 127.0.0.1, port_value: 9901 } }
    static_resources:
      listeners:
      - name: main
        address: { socket_address: { address: 0.0.0.0, port_value: 8080 } }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: mcp_edge
              route_config:
                name: local
                virtual_hosts:
                - name: mcp
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route:
                      cluster: mcp_gateway
                      host_rewrite_literal: mcp-gateway.apps.ocp-gb.ibm.redhataicatalyst.com
                      timeout: 60s
              http_filters:
              - name: envoy.filters.http.jwt_authn
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                  providers:
                    keycloak:
                      issuer: https://mcp-keycloak.apps.ocp-gb.ibm.redhataicatalyst.com/realms/mcp
                      audiences: [ mcp-gateway ]
                      forward: true
                      remote_jwks:
                        http_uri:
                          uri: http://mcp-keycloak-service.keycloak.svc.cluster.local:8080/realms/mcp/protocol/openid-connect/certs
                          cluster: keycloak_jwks
                          timeout: 5s
                        cache_duration: { seconds: 300 }
                  rules:
                  - match: { prefix: "/.well-known" }
                  - match: { prefix: "/" }
                    requires: { provider_name: keycloak }
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: mcp_gateway
        type: STRICT_DNS
        connect_timeout: 2s
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: mcp_gateway
          endpoints:
          - lb_endpoints:
            - endpoint: { address: { socket_address: { address: mcp-gateway-data-science-gateway-class.mcp-gateway-system.svc.cluster.local, port_value: 8443 } } }
      - name: keycloak_jwks
        type: STRICT_DNS
        connect_timeout: 2s
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: keycloak_jwks
          endpoints:
          - lb_endpoints:
            - endpoint: { address: { socket_address: { address: mcp-keycloak-service.keycloak.svc.cluster.local, port_value: 8080 } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: envoy-edge, namespace: mcp-gateway-system, labels: { app: envoy-edge } }
spec:
  replicas: 1
  selector: { matchLabels: { app: envoy-edge } }
  template:
    metadata: { labels: { app: envoy-edge } }
    spec:
      containers:
      - name: envoy
        image: docker.io/envoyproxy/envoy:v1.31.0
        args: ["-c","/etc/envoy/envoy.yaml","--log-level","info"]
        ports: [ { containerPort: 8080 } ]
        volumeMounts: [ { name: cfg, mountPath: /etc/envoy } ]
      volumes: [ { name: cfg, configMap: { name: envoy-edge-config } } ]
---
apiVersion: v1
kind: Service
metadata: { name: envoy-edge, namespace: mcp-gateway-system }
spec:
  selector: { app: envoy-edge }
  ports: [ { port: 8080, targetPort: 8080 } ]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: { name: mcp-secure, namespace: mcp-gateway-system }
spec:
  host: mcp-secure.apps.ocp-gb.ibm.redhataicatalyst.com
  to: { kind: Service, name: envoy-edge, weight: 100 }
  port: { targetPort: 8080 }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
