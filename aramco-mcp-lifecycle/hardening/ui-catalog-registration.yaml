# OpenShift AI UI Catalog Registration for MemPalace
#
# This ConfigMap registers MemPalace in the Gen AI chat MCP selector. The
# native AI Hub MCP Catalog is configured separately in
# native-mcp-catalog-registration.yaml.
#
# The UI discovery is complementary to the Kuadrant MCPServerRegistration CRD,
# which governs federation (tool routing, OIDC, per-tool auth).
#
# Apply this after Phase 1.2 (MCPServerRegistration):
#   oc apply -f ui-catalog-registration.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: gen-ai-aa-mcp-servers
  namespace: redhat-ods-applications
data:
  mempalace: |
    {
      "url": "https://mcp-secure.apps.ocp-gb.ibm.redhataicatalyst.com/mcp",
      "transport": "streamable-http",
      "description": "MemPalace semantic memory MCP server for the Saudi Aramco OpenShift AI demo"
    }
